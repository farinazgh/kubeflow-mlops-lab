# PIPELINE DEFINITION
# Name: first-kubeflow-pipeline
# Inputs:
#    seed: int [Default: 3.0]
# Outputs:
#    Output: int
components:
  comp-generate-number:
    executorLabel: exec-generate-number
    inputDefinitions:
      parameters:
        seed:
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      parameters:
        Output:
          parameterType: NUMBER_INTEGER
  comp-square-number:
    executorLabel: exec-square-number
    inputDefinitions:
      parameters:
        value:
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      parameters:
        Output:
          parameterType: NUMBER_INTEGER
deploymentSpec:
  executors:
    exec-generate-number:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - generate_number
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.18.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef generate_number(seed: int) -> int:\n    return seed * 2\n\n"
        image: python:3.12-slim
    exec-square-number:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - square_number
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.18.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef square_number(value: int) -> int:\n    return value**2\n\n"
        image: python:3.12-slim
pipelineInfo:
  name: first-kubeflow-pipeline
root:
  dag:
    outputs:
      parameters:
        Output:
          valueFromParameter:
            outputParameterKey: Output
            producerSubtask: square-number
    tasks:
      generate-number:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-generate-number
        inputs:
          parameters:
            seed:
              componentInputParameter: seed
        taskInfo:
          name: generate-number
      square-number:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-square-number
        dependentTasks:
        - generate-number
        inputs:
          parameters:
            value:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: generate-number
        taskInfo:
          name: square-number
  inputDefinitions:
    parameters:
      seed:
        defaultValue: 3.0
        isOptional: true
        parameterType: NUMBER_INTEGER
  outputDefinitions:
    parameters:
      Output:
        parameterType: NUMBER_INTEGER
schemaVersion: 2.1.0
sdkVersion: kfp-2.18.0
