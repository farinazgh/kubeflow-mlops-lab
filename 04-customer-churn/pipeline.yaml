                producerTask: train-churn-model
          parameters:
            split_name:
              runtimeValue:
                constant: test
        taskInfo:
          name: evaluate-churn-model-2
      prepare-churn-data:
        cachingOptions: {}
        componentRef:
          name: comp-prepare-churn-data
        inputs:
          parameters:
            data_url:
              componentInputParameter: data_url
            random_state:
              componentInputParameter: random_state
        taskInfo:
          name: prepare-churn-data
