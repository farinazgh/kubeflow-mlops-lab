apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: seaweedfs
    application-crd-id: kubeflow-pipelines
  name: seaweedfs
  namespace: kubeflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
      application-crd-id: kubeflow-pipelines
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: seaweedfs
        application-crd-id: kubeflow-pipelines
    spec:
      containers:
      - args:
        - server
        - -dir=/data
        - -s3
        - -iam
        - -filer
        - -master.volumePreallocate=false
        envFrom:
        - secretRef:
            name: mlpipeline-minio-artifact
        image: ghcr.io/chrislusf/seaweedfs:4.50
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                # Wait up to 120 seconds  for SeaweedFS master to be ready
                for i in $(seq 1 60); do
                  if wget -q --spider http://127.0.0.1:8333/status; then
                    break
                  fi
                  if [ "$i" -eq 60 ]; then
                    echo "ERROR: SeaweedFS master did not become ready within 120 seconds"
                    exit 1
                  fi
                  sleep 2
                done

                # Create bucket with retries (maximum 25 seconds)
                for attempt in $(seq 1 5); do
                  if bucket_listing=$(echo "s3.bucket.list" | /usr/bin/weed shell 2>/dev/null); then
                    if printf '%s\n' "$bucket_listing" | grep -Eq '^[[:space:]]*mlpipeline[[:space:]]'; then
                      break
                    fi
                    if echo "s3.bucket.create --name mlpipeline" | /usr/bin/weed shell >/dev/null 2>&1 &&
                      bucket_listing=$(echo "s3.bucket.list" | /usr/bin/weed shell 2>/dev/null) &&
                      printf '%s\n' "$bucket_listing" | grep -Eq '^[[:space:]]*mlpipeline[[:space:]]'; then
                      break
                    fi
                  fi
                  if [ "$attempt" -eq 5 ]; then
                    echo "ERROR: Could not verify or create mlpipeline bucket after 5 attempts"
                    exit 1
                  fi
                  sleep 5
                done

                # Configure admin user with retries (25s max)
                for i in $(seq 1 5); do
                  if echo "s3.configure -user kubeflow-admin -access_key $accesskey -secret_key $secretkey -actions Admin -apply" | /usr/bin/weed shell 2>&1; then
                    break
                  fi
                  if [ "$i" -eq 5 ]; then
                    echo "ERROR: Failed to configure kubeflow-admin after 5 attempts"
                    exit 1
                  fi
                  sleep 5
                done

                # Verify bucket is accessible
                if ! echo "s3.bucket.list" | /usr/bin/weed shell | grep -q mlpipeline; then
                  echo "ERROR: mlpipeline bucket verification failed"
                  exit 1
                fi

                # Signal successful initialization for the startup probe
                touch /tmp/initialization-complete
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /status
            port: 8333
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        name: seaweedfs
        ports:
        - containerPort: 8333
        - containerPort: 8111
        - containerPort: 9333
        - containerPort: 19333
        - containerPort: 8888
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /status
            port: 8333
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 64m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - test -f /tmp/initialization-complete && echo "s3.bucket.list" | /usr/bin/weed
              shell | grep -q mlpipeline
          failureThreshold: 24
          initialDelaySeconds: 10
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 10
        volumeMounts:
        - mountPath: /data
          name: data
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: seaweedfs
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: seaweedfs-pvc
