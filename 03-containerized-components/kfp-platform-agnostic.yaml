          name: http
        - containerPort: 8887
          name: grpc
        readinessProbe:
          httpGet:
            path: /apis/v2/healthz
            port: 8888
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          requests:
            cpu: 250m
            memory: 500Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 0
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          failureThreshold: 12
          httpGet:
            path: /apis/v2/healthz
            port: 8888
          periodSeconds: 5
          timeoutSeconds: 2
        volumeMounts:
        - mountPath: /etc/mlflow-tracking-ca
          name: mlflow-tracking-ca
          readOnly: true
      initContainers:
      - args:
        - |
          if [ -z "${WAIT_HOST}" ] || [ -z "${WAIT_PORT}" ]; then
            echo "ERROR: WAIT_HOST or WAIT_PORT is not set."
            exit 1
          fi
          MAX_RETRIES=60; i=0
          while ! nc -z -w 2 "${WAIT_HOST}" "${WAIT_PORT}"; do
            i=$((i+1))
            if [ "$i" -ge "$MAX_RETRIES" ]; then
              echo "ERROR: Timed out waiting for ${WAIT_HOST}:${WAIT_PORT} after ${MAX_RETRIES} attempts."
              exit 1
            fi
            echo "Waiting for ${WAIT_HOST}:${WAIT_PORT} (attempt ${i}/${MAX_RETRIES})..."
            sleep 5
          done
        command:
        - /bin/sh
        - -ec
        env:
        - name: WAIT_HOST
          valueFrom:
            configMapKeyRef:
              key: mysqlHost
              name: pipeline-install-config
        - name: WAIT_PORT
          valueFrom:
            configMapKeyRef:
              key: mysqlPort
              name: pipeline-install-config
        image: docker.io/alpine:3.23
        name: wait-for-database
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: ml-pipeline
      volumes:
      - configMap:
          name: mlflow-tracking-ca
          optional: true
        name: mlflow-tracking-ca
