apiVersion: v1
data:
  defaultPipelineRoot: ""
kind: ConfigMap
metadata:
  labels:
    application-crd-id: kubeflow-pipelines
  name: kfp-launcher
  namespace: kubeflow
---
apiVersion: v1
data:
  kubeflow_pipelines_version: dev
kind: ConfigMap
metadata:
  labels:
    application-crd-id: kubeflow-pipelines
  name: kubeflow-pipelines-public
  namespace: kubeflow
---
apiVersion: v1
data:
  sidecar.automountServiceAccountToken: "true"
  sidecar.container: |
    name: driver-plugin
    image: ghcr.io/kubeflow/kfp-driver:2.17.1
    terminationMessagePolicy: FallbackToLogsOnError
    imagePullPolicy: IfNotPresent
    env:
      - name: KFP_POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
    ports:
      - containerPort: 8080
    resources:
      requests:
        cpu: "0.1"
        memory: "64Mi"
      limits:
        cpu: "0.5"
        memory: "0.5Gi"
    securityContext:
      # Match Argo's agent init UID to read the shared authentication token.
      runAsNonRoot: true
      runAsUser: 8737
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
    - name: var-run-argo
      mountPath: /kfp/log
      subPath: driver-plugin
      readOnly: false
kind: ConfigMap
metadata:
  labels:
    application-crd-id: kubeflow-pipelines
    workflows.argoproj.io/configmap-type: ExecutorPlugin
  name: ml-pipeline-driver-agent
  namespace: kubeflow
---
apiVersion: v1
data:
  viewer-pod-template.json: |-
    {
        "spec": {
            "serviceAccountName": "kubeflow-pipelines-viewer"
        }
    }
kind: ConfigMap
metadata:
  labels:
    application-crd-id: kubeflow-pipelines
  name: ml-pipeline-ui-configmap
  namespace: kubeflow
---
apiVersion: v1
data:
  image: ghcr.io/kubeflow/kfp-frontend:2.17.1
  job-template: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      # The generated ConfigMap hash also names the Job, allowing image/template upgrades.
      name: ml-pipeline-ui-signing-key-init
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            sidecar.istio.io/inject: "false"
        spec:
          serviceAccountName: ml-pipeline-ui-signing-key-init
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: initialize
              image: ghcr.io/kubeflow/kfp-frontend:dummy
              imagePullPolicy: IfNotPresent
              workingDir: /server
              command: [node, dist/initialize-tensorboard-signing-key.js]
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: SIGNING_SECRET_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: ml-pipeline-ui-signing-key-init
                      key: secretName
                - name: SIGNING_SECRET_KEY
                  valueFrom:
                    configMapKeyRef:
                      name: ml-pipeline-ui-signing-key-init
                      key: secretKey
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
  secretKey: signing-secret
  secretName: ml-pipeline-ui-tensorboard-proxy
kind: ConfigMap
