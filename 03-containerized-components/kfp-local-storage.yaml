apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: kfp-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kfp-mysql-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: kfp-local
  claimRef:
    namespace: kubeflow
    name: mysql-pv-claim
  local:
    path: /var/lib/kfp/mysql
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ip-172-31-39-134
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kfp-seaweedfs-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: kfp-local
  claimRef:
    namespace: kubeflow
    name: seaweedfs-pvc
  local:
    path: /var/lib/kfp/seaweedfs
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ip-172-31-39-134
